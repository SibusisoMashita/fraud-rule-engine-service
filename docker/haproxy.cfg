global
    maxconn 60
    nbthread 1
    hard-stop-after 30s
    tune.bufsize 32768
    stats socket ipv4@127.0.0.1:9999 level admin

defaults
    mode http
    timeout connect 1s
    timeout check 1s
    timeout client 10s
    timeout server 10s
    timeout http-request 5s
    timeout http-keep-alive 2s
    timeout queue 1s
    retries 0
    # A proxy failure may follow dispatch; never claim that such a write was rejected.
    http-error status 503 content-type application/problem+json lf-string '{"type":"about:blank","title":"Service Unavailable","status":503,"code":"BACKEND_UNAVAILABLE","detail":"The proxy could not confirm the outcome of this request.","correlationId":"%[unique-id]","retryable":true,"outcome":"UNKNOWN"}' hdr Cache-Control no-store hdr Retry-After 1 hdr X-Correlation-ID %[unique-id]

resolvers docker
    nameserver docker 127.0.0.11:53
    accepted_payload_size 8192
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 1s
    hold obsolete 1s

frontend ingress
    bind :8080
    maxconn 40
    unique-id-format %[uuid()]
    http-request del-header Forwarded
    http-request del-header X-Forwarded-For
    http-request del-header X-Forwarded-Proto
    http-request del-header X-Forwarded-Host
    http-request del-header X-Real-IP
    http-request deny deny_status 413 if { req.hdr_val(content-length) gt 16384 }
    http-request wait-for-body time 5s at-least 16385 if { method POST PUT PATCH }
    http-request deny deny_status 413 if { req.body_size gt 16384 }
    http-response set-header X-Demo-Backend %[srv_name] if { env(FRAUD_DEMO_HEADERS) -m str true }
    default_backend fraud

backend fraud
    # This response is built before selecting or contacting an application instance.
    http-request return status 503 content-type application/problem+json lf-string '{"type":"about:blank","title":"Service Unavailable","status":503,"code":"NO_READY_BACKEND","detail":"No application instance is ready to receive this request.","correlationId":"%[unique-id]","retryable":true,"outcome":"NOT_ACCEPTED"}' hdr Cache-Control no-store hdr Retry-After 1 hdr X-Correlation-ID %[unique-id] if { nbsrv(fraud) eq 0 }
    balance roundrobin
    option httpchk
    http-check send meth GET uri /health/ready ver HTTP/1.1 hdr Host localhost
    http-check expect status 200
    default-server init-state fully-down inter 1s fall 1 rise 2 maxconn 20 maxqueue 20
    server-template app "${FRAUD_MAX_REPLICAS}" app:8080 check resolvers docker init-addr none resolve-prefer ipv4
